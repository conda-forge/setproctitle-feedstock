context:
  version: "1.3.8"

package:
  name: setproctitle
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/setproctitle/setproctitle-${{ version }}.tar.gz
  sha256: cafe209d064a6efb88cb45a03e97981ff8832802b2b5d009dde0197a3b7b41c8

build:
  script: ${{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - setuptools
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - setproctitle
      pip_check: true

about:
  homepage: https://github.com/dvarrazzo/py-setproctitle
  summary: A Python module to customize the process title
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - pelson
    - ocefpaf
    - scopatz
